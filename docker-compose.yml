version: '3.8'

services:
  app:
    build: .
    ports:
      - "8000:8080"
    volumes:
      - .:/var/www/html
    environment:
      - DB_HOST=db
      - DB_NAME=stock_trading_db
      - DB_USER=root
      - DB_PASS=Dhruba2232537
      - DB_CHARSET=utf8mb4
      - DB_CONNECTION=mysql
      - APP_ENV=development
    depends_on:
      - db
    networks:
      - stock-network

  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: Dhruba2232537
      MYSQL_DATABASE: stock_trading_db
    volumes:
      - db_data:/var/lib/mysql
      # Auto-init database with our scripts
      - ./ibkr_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./seed_ibkr.sql:/docker-entrypoint-initdb.d/02_data.sql
    networks:
      - stock-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - "8080:80"
    environment:
      - PMA_HOST=db
      - PMA_USER=root
      - PMA_PASSWORD=Dhruba2232537
    depends_on:
      - db
    networks:
      - stock-network

networks:
  stock-network:
    driver: bridge

volumes:
  db_data:
